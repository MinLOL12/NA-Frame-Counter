name: Build NA Frame Counter

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  test-core:
    name: Core Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and run unit tests
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -Werror -Isrc \
            src/math/NandlCalculator.cpp \
            src/core/FrameConfig.cpp \
            tests/test_core.cpp \
            -o test_core
          ./test_core

  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64

          - name: macOS
            os: macos-latest
            target: MacOS

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: Build (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Combine & Package
    runs-on: ubuntu-latest
    needs: ['test-core', 'build']

    steps:
      - name: Combine platform builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine
        with:
          zstd: true
          optimize-pngs: true

      - name: Upload combined .geode artifact
        uses: actions/upload-artifact@v7
        with:
          name: na-frame-counter-geode
          path: ${{ steps.combine.outputs.build-output }}

      - name: Create Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_OUTPUT: ${{ steps.combine.outputs.build-output }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$BUILD_OUTPUT"/*.geode \
            --generate-notes \
            --verify-tag
